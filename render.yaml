# Render Deployment Configuration
services:
  # Backend Service
  - type: web
    name: adb-project-backend
    runtime: node
    plan: free
    env: node
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
    autoDeploy: true

  # Frontend Service
  - type: web
    name: adb-project-frontend
    runtime: node
    plan: free
    env: node
    buildCommand: cd frontend && npm install && npm run build
    startCommand: cd frontend && npx serve -s build -l $PORT
    envVars:
      - key: REACT_APP_API_BASE_URL
        sync: false
    autoDeploy: true
